[build-system]
requires = ["setuptools==84.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blindshield-arena-backend"
version = "0.2.0"
description = "Independent arena.v2 backend contracts and integration foundation"
requires-python = ">=3.12"
dependencies = ["pydantic==2.14.1", "cryptography==50.0.2"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
arena = "arena.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
